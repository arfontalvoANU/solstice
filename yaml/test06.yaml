- sun: &sun { dni: 1 }

- material: &lambertian
    front:
      matte: { reflectivity: 1 }
    back:
      matte: { reflectivity: 1 }
      
- material: &specular
      mirror: { reflectivity: 1, slope_error: 0 }
      
              
- template: &self_oriented_parabol
    name: "ground"
    primary: 0
    geometry:
      - material: *lambertian
        plane:
          clip:
            - operation: AND
              vertices:
                - [-20.0, -20.0]
                - [-20.0,  20.0]
                - [ 20.0,  20.0]
                - [ 20.0, -20.0]
    children:
      - name: "pivot"
        transform: { translation: [0, 0, 4], rotation: [0, 0, 90] }
        x_pivot:
          target: { sun: *sun }
        children:
          - name: "parabol"
            primary: 1
            geometry:
            - material: *specular
              parabol:
                focal: 4
                clip:
                - operation: AND
                  vertices: [[-5.0, -5.0], [-5.0, 5.0], [5.0, 5.0], [5.0, -5.0]]
          - name: "small_square"
            transform: { translation: [0, 0, 4] }
            primary: 0
            geometry:
            - material:  { virtual: }
              plane:
                clip:
                  - operation: AND
                    vertices:
                      - [-0.50, -0.50]
                      - [-0.50, 0.50]
                      - [0.50, 0.50]
                      - [0.50, -0.50]
      
    
- entity:
    name: "reflector"
    transform: { rotation: [0, 0, 0], translation: [0, 0, 0] }
    children: [ *self_oriented_parabol ]
    
