- material: &mirror
    mirror:
      reflectivity: 1
      roughness: 0

- geometry: &cylinder
    - material: *mirror
      cylinder:
        height: 1
        radius: 1
        slices: 32

- entity:
    name: "hop"
    geometry: *cylinder
    transform:
      translation: [0, 1, 2]
      rotation: [0, 0, 0]
