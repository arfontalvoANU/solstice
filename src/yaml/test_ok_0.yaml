- instance:
    object:
      transform:
        rotation: [ 0, 1, 2 ]
        translation: [ -4, 5.2, -6.5 ]
      material: { matte: { reflectivity: 1 } }
      cuboid: { size: [1, 2, 3] }

---
- instance:
    transform: { translation: [ 1, 2, 0 ] }
    object:
      transform:
        rotation: [ 0, 1, 2 ]
      material: { matte: { reflectivity: 1 } }
      cuboid: { size: [1, 2, 3] }

---
- instance:
    object:
      material: { matte: { reflectivity: 1 } }
      cuboid: { size: [1, 2, 3] }

---
- material: &lambertian
    matte: { reflectivity: 1 }

- instance:
    object:
      material: *lambertian
      cuboid: { size: [1, 2, 3] }

---
- material: &front { matte: { reflectivity: 1 } }
- material: &back  { matte: { reflectivity: 0.5 } } 
- object: &cuboid
    cuboid: { size: [1, 2, 3] }
    material: { front: *front, back: *back }
- instance: { object: *cuboid }
---
- material: &lambertian { matte: { reflectivity: 1 } }
- instance:
    object: &cuboid
      cuboid: { size: [1, 2, 3] }
      material: 
        front: *lambertian
        back: *lambertian


