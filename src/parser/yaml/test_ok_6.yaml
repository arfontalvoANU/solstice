- sun: { dni: 1, spectrum: [{wavelength: 1, data: 1}] }
- entity:
    name: entity
    primary: 1
    geometry:
      - material: { mirror: { reflectivity: 0, roughness: 0.5 } }
        plane:
          slices: 4
          clip:
          - operation: AND
            vertices:
            - [-0.50, -0.50]
            - [-0.50, 0.50]
            - [0.50, 0.50]
            - [0.50, -0.50]
