- sun: { dni: 1, spectrum: [{wavelength: 1, data: 1}] }

- material: &thin_dielectric
    thin_dielectric:
      thickness: 1
      medium_i: { absorptivity: 0, refractive_index: 1.00027 }
      medium_t: { absorptivity: 0.1, refractive_index: 1.5 }

- entity:
    name: "entity"
    primary: 0
    geometry:
      - material: *thin_dielectric
        cylinder: { height: 1, radius: 1 }
