- sun: { dni: 1, spectrum: [{wavelength: 1, data: 1}] }
- entity:
    name: "entity"
    primary: 0
    transform:
      rotation: [ 0, 1, 2 ]
      translation: [ -4, 5.2, -6.5 ]
    geometry:
      - cuboid: { size: [1, 2, 3] }
        material: { matte: { reflectivity: 1 } }

---
- sun: { dni: 1, spectrum: [{wavelength: 1, data: 1}] }
- entity:
    name: "entity"
    primary: 0
    transform: { translation: [ 1, 2, 0 ] }
    geometry:
      - transform:
          rotation: [ 0, 1, 2 ]
        material: { matte: { reflectivity: 1 } }
        cuboid: { size: [1, 2, 3] }

---
- sun: { dni: 1, spectrum: [{wavelength: 1, data: 1}] }
- entity:
    name: "entity"
    primary: 0
    geometry:
      - material: { matte: { reflectivity: 1 } }
        cuboid: { size: [1, 2, 3] }

---
- material: &lambertian
    matte: { reflectivity: 1 }

- entity:
    name: "entity"
    primary: 0
    geometry:
      - material: *lambertian
        cuboid: { size: [1, 2, 3] }
- sun: { dni: 1, spectrum: [{wavelength: 1, data: 1}] }
---
- material: &front { matte: { reflectivity: 1 } }
- material: &back  { matte: { reflectivity: 0.5 } }
- geometry: &cuboid
    - cuboid: { size: [1, 2, 3] }
      material: { front: *front, back: *back }
- entity: { name: "hop", primary: 1, geometry: *cuboid }
- sun: { dni: 1, spectrum: [{wavelength: 1, data: 1}] }
---
- material: &lambertian { matte: { reflectivity: 1 } }
- sun: { dni: 1, spectrum: [{wavelength: 1, data: 1}] }
- entity:
    name: hop
    primary: 0
    geometry: &cuboid
      - cuboid: { size: [1, 2, 3] }
        material:
          front: *lambertian
          back: *lambertian

